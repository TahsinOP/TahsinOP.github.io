# ─────────────────────────────────────────────────────────────
#  Build
# ─────────────────────────────────────────────────────────────
plugins:
  - jekyll-sitemap

permalink: pretty
markdown:  kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - tools
  - vendor
  - .jekyll-cache

defaults:
  - scope: { path: "" }
    values: { layout: "page" }
