# Newest first. `text` may contain inline HTML (<b>, <a>, <em>).
- date: "Sep 2026"
  text: >-
    <b>Niti Vahan</b>, the eYRC 2026-27 theme, is live — an autonomous car under
    city road rules, selected by <b>1500 teams</b> nationally, running a
    monocular lane-detection and docking stack on a Raspberry Pi against a
    matched CoppeliaSim digital twin.

- date: "Jul 2026"
  text: >-
    Mentored and co-mentored <b>two eYSIP research projects with four interns</b>
    — imitation learning on bimanual SO-101 and UR5 arms — plus a third on
    <b>3D LiDAR SLAM flown on a Holybro X500</b>.

- date: "Mar 2026"
  text: >-
    Ranked <b>32 of 62 teams internationally</b> in the <b>LeHome Challenge at
    IEEE ICRA 2026</b> — bimanual cloth folding in Isaac Sim, comparing
    specialist and generalist SmolVLA policies.

- date: "Feb 2026"
  text: >-
    Started research on <b>decentralised cooperative mobile manipulation</b> —
    two nonholonomic mobile manipulators transporting a shared payload with
    onboard vision only, an invariant EKF on SE(3) and a 14-DoF whole-body QP.

- date: "Jan 2026"
  text: >-
    <i>Soft autonomous mobile manipulators in agricultural automation – a review</i>
    published in <b>Industrial Robot</b>, Vol. 53 No. 2, pp. 376–398.

- date: "Aug 2025"
  text: >-
    Joined the <b>ERTS Lab (e-Yantra), IIT Bombay</b> as a Senior Project
    Technical Assistant, working on e-Yantra Robotics Competition theme
    development.
