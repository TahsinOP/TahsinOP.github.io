  - 'Talk on imitation learning and VLAs with LeRobot and the SO-101 arm, for e-Yantra''s SO-101 series (<a href="https://youtu.be/vWnEfLNI44w" target="_blank" rel="noopener">watch</a>).'
  - "Two-day embedded systems Faculty Development Programmes for ~80 college professors in Bengaluru and Mysore."
  - "Two-day ROS workshop for 40+ participants under e-Yantra's Women in Robotics initiative."
  - "Electronics SIG Head, SAE NITK (2024-25): led year-long student projects in autonomous vehicles and robotics."

