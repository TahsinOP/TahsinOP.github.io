# ── Home page intro ───────────────────────────────────────────
# Each paragraph accepts inline HTML: <b>, <a href="...">, <em>.
intro:
  - >-
    I'm a robotics engineer at the
    <a href="https://www.e-yantra.org/" target="_blank" rel="noopener">ERTS Lab, IIT Bombay</a>,
    working on autonomy for ground and aerial robots. I hold a B.Tech in
    Mechanical Engineering from NITK Surathkal.
  - >-
    My recent work covers <b>grasp-anchored cooperative transport</b> with two mobile manipulators,
    LiDAR and visual SLAM on UAVs, monocular autonomy for Ackermann vehicles,
    and remote robotics education platforms. Along the way I have worked on
    state estimation, motion planning, optimisation-based control and
    imitation learning for bimanual manipulation.

# ── About page ────────────────────────────────────────────────
bio:
  - >-
    I started in mechanical design, building ring-throwing robots for Robocon,
    and moved steadily up the stack: arm motion planning, then embedded control
    and navigation, then SLAM and state estimation, and now multi-robot
    manipulation and learned policies. Most of what I build spans all three
    layers: the mechanism, the electronics and the software that runs on them.

education:
  - degree:   "B.Tech. in Mechanical Engineering"
    minor:    "Minor in Electronics and Communication Engineering"
    school:   "National Institute of Technology Karnataka (NITK), Surathkal"
    date:     "Dec 2021 - Apr 2025"
    detail:   "CGPA 8.22 / 10 (major) · 8.20 / 10 (minor)"

outreach:
