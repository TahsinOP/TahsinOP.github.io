subtitle: >-
  Robotics Research engineer at
  <a href="https://www.e-yantra.org/" target="_blank" rel="noopener">e-Yantra</a>,
  ERTS Lab, IIT Bombay.

intro:
  - >-
    Currently working at the <b>ERTS Lab (e-Yantra), IIT
    Bombay</b> a robotics outreach programme where i develop theme stacks that students across India compete
    on through the  <a href="https://portal.e-yantra.org/themes" target="_blank" rel="noopener">e-Yantra Robotics Competition </a>,  currently developing <b>Niti Vahan</b>,
    an Ackermann vehicle that has to drive a scaled city from a single
    forward-facing camera. Previous year worked on Krishi Cobot, a greenhouse automation system where two industrial robots a mobile robot and a UR5 manipulator collaboratively doing tasks. The whole system was given remote acess through our platform all over India 
  - >-
    My ongoing reseach work is towards <b>cooperative non-holonomic mobile manipulation</b>: Two mobile
    manipulators carrying a shared payload . Previous work involves visual SLAM (Mapping)
    written from scratch, 3D LiDAR SLAM flown on a Holybro UAV and lately, exploring 
    <b>learning</b> for manipulation, navigation 
 
education:
  - degree:   "B.Tech. in Mechanical Engineering"
    minor:    "Minor in Electronics and Communication Engineering"
    school:   "National Institute of Technology Karnataka (NITK), Surathkal"
    location: "Surathkal, India"
    date:     "2021 — 2025"
    detail:   "CGPA 8.22 / 10 (major) · 8.25 / 10 (minor)"

# Grouped by what the work actually is, not by department.
skills:
  - group: Autonomy & Planning
    key:   navigation
    blurb: "Getting a robot from where it is to where it should be."
    items: [ROS, ROS 2, Nav2, "Global & local planners (A*, APF, DWA, MPPI)", Pure Pursuit, Ackermann & Differential Drives, Mecanum & Holonomic Drives, Autoware, Gazebo]
  - group: Perception, SLAM & Estimation
    key:   slam
    blurb: "Working out where the robot is and what is around it."
    items: [Visual SLAM, "LiDAR SLAM (LIO-SAM, FAST-LIO, KISS-ICP)", ICP, Pose-Graph Optimization, Loop Closure, Bag of Words, EKF, Particle Filter / AMCL, Visual Odometry, OpenCV, Open3D, ArUco & Pose Estimation, Homography, RealSense D435/D455/D405]
  - group: Manipulation & Control
    key:   manipulation
    blurb: "Arms, mobile manipulators and the control that coordinates them."
    items: [MoveIt, "Analytical & Numerical IK", Weighted DLS, Jacobians & Null-Space Control, Singularity Handling, Visual Servoing, QP Whole-Body Control, MuJoCo, UR5, SO-101]
  - group: Learning
    key:   learning
    blurb: "Imitation learning and vision-language-action models for manipulation."
    items: [LeRobot, ACT, Diffusion Policy, SmolVLA, "π0", X-VLA, Action Chunking, Flow Matching, Teleoperation & Dataset Collection]
  - group: Embedded & Hardware
    key:   hardware
    blurb: "The electronics and low-level control everything else runs on."
    items: [ESP32, Raspberry Pi, Arduino, NVIDIA Jetson Orin, Circuit & Power-Distribution Design, UART / Serial, "LiDAR, IMU & Depth-Camera Integration", Siemens TIA]
  - group: Mechanical Design
    key:   mechanical
    blurb: "Earlier work — chassis, mechanisms and rapid prototyping."
    items: [Fusion 360, Onshape, SolidWorks, ANSYS (FEA & CFD), Mechanism Design, 3D Printing, Laser Cutting, Rapid Prototyping]
