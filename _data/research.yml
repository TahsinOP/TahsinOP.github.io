# ── Research areas ────────────────────────────────────────────
areas:
  - name: Navigation
    key:  navigation
    text: "Ackermann, differential and holonomic platforms. Nav2, global and local planners, pure pursuit."
  - name: SLAM & Estimation
    key:  slam
    text: "Visual SLAM written from scratch; 3D LiDAR SLAM flown on a drone. EKF, AMCL, pose-graph optimization."
  - name: Perception
    key:  perception
    text: "Depth cameras, ArUco pose, homography, bird's-eye-view lane pipelines."
  - name: Manipulation
    key:  manipulation
    text: "IK, Jacobians and null-space control, visual servoing, QP whole-body control."
  - name: Learning
    key:  learning
    text: "ACT, diffusion policy, SmolVLA, π0 — action chunking and flow matching for manipulation."
  - name: Hardware
    key:  hardware
    text: "ESP32 low-level control, power distribution, Jetson, LiDAR and depth-camera integration."

