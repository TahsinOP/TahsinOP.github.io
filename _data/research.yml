work:
  - slug:    coop-manipulation
    title:   "Grasp-Anchored Cooperative Transport"
    status:  "Ongoing"
    tagline: "Two mobile manipulators carry one rigid payload, and the grasp itself tells each robot where its partner is."
    org:     "IIT Bombay"
    period:  "Feb 2026 - Present"
    advisor: "Prof. Shivaram Kalyanakrishnan, Prof. Harshad Khadilkar, Prof. Nived Chebrolu"
    cover:   /assets/img/coop-manipulation/cover.jpg
    card: "Two custom mobile manipulators carry one payload with onboard vision only: no mocap, no shared map."
    summary: >-
      Two custom nonholonomic mobile manipulators carry a rigid payload using
      only onboard vision and decentralised compute: no motion capture, no
      shared map and no force/torque sensing at the grasp. Planning and control
      run in the payload frame, an EKF on SE(3) recovers relative pose through
      the kinematic chain of the shared grasp at 50 Hz on a Jetson Orin, and a
      14-DoF whole-body QP keeps the closed chain feasible as the estimate
      degrades.
    topics: [Mobile Manipulation, Multi-Agent, State Estimation, Control]
    contributions:
      - "Posed planning and control in the payload frame, so transport depends only on the relative pose between the two robots."
      - "Recovered relative pose through the kinematic chain of the shared grasp, with an EKF on SE(3) running at 50 Hz on a Jetson Orin."
      - "Developed and tested a 14-DoF whole-body QP controller in MuJoCo simulation before deploying it on hardware, weighting the closed-chain constraint by the live estimator covariance."
    stack: [Whole-Body QP, EKF on SE(3), MuJoCo, Jetson Orin]
    links: []
    hero:
      video:   /assets/video/coop-manipulation/long-demo.mp4
      poster:  /assets/img/coop-manipulation/long-poster.jpg
      caption: "Cooperative transport on hardware."
    body:
      - >-
        Cooperative transport is usually shown with motion capture, a shared
        map or force/torque sensors at the grasp. This work removes all three.
        Two custom nonholonomic mobile manipulators carry a rigid payload using
        only <b>onboard vision and decentralised compute</b>.
      - h: Planning in the payload frame
      - >-
        Planning and control are posed entirely in the payload frame, so
        transport depends only on the <b>relative pose</b> between the two
        robots. Global localisation reduces to a coarse, landmark-based estimate
        of where the payload and the bases sit in the workspace.
      - h: Relative pose from the grasp
      - >-
        Relative pose is recovered through the <b>kinematic chain of the shared
        grasp</b>, not from odometry. This makes relative orientation, the
        channel where error strains the grasp, immune to wheel slip and map
        drift.
      - >-
        An EKF on SE(3) estimates each grasp transform with χ² innovation
        gating, running at <b>50 Hz on a Jetson Orin</b> from 30 Hz wrist-camera
        detections.
      - h: Whole-body control
      - >-
        A <b>14-DoF whole-body QP</b> carries the closed-chain constraint as a
        soft cost, weighted by the live estimator covariance. When the estimate
        degrades, the coupling relaxes, so the solver stays feasible
        mid-transport.
      - >-
        The controller and the planner were first developed and tested in
        <b>MuJoCo simulation</b>, then deployed on the real robots.
    gallery:
      - src:     /assets/img/coop-manipulation/setup.jpg
        caption: "Both manipulators grasping the shared payload."
      - src:     /assets/img/coop-manipulation/formation-clean.jpg
        caption: "The two custom mobile manipulators holding the shared payload."
      - src:     /assets/img/coop-manipulation/formation.jpg
        caption: "The pair in formation."
      - video:   /assets/video/coop-manipulation/short-path.mp4
        poster:  /assets/img/coop-manipulation/short-poster.jpg
        caption: "Transport along a short path."

  - slug:    soft-mobile-manipulators
    title:   "Soft Autonomous Mobile Manipulators in Agricultural Automation: A Review"
    status:  "Industrial Robot 2026, 4 citations"
    tagline: "The first comprehensive review of soft mobile manipulation as an integrated system for agriculture."
    org:     "NITK Surathkal"
    period:  "Sep 2024 - Apr 2025"
    advisor: "Prof. Mervin Joe Thomas"
    cover:   /assets/img/soft-mobile-manipulators/fig11-field-robots.webp
    cover_fit: contain
    card: "A systematic review of soft grippers, mobile bases and planning for agricultural robots."
    summary: >-
      A systematic review of soft autonomous mobile manipulators (SAMMs) for
      harvesting and crop monitoring, published in <i>Industrial Robot</i>
      (2026). It compares soft gripping and actuation across actuator families,
      reviews localisation and path planning for mobile bases in unstructured
      fields, and analyses the mobile manipulator design space. The main
      finding: each part has matured, but integrating them is the open problem.
    topics: [Soft Robotics, Mobile Manipulation, Planning]
    contributions:
      - "Wrote a systematic review of soft mobile manipulators for agriculture, published in Industrial Robot (2026)."
      - "Compared soft gripping and actuation across actuator families on compliance, payload and crop damage."
      - "Analysed the mobile manipulator design space to show where gripper compliance relaxes precision on the base and arm."
    stack: [Soft Grippers, Mobile Manipulation, Path Planning]
    links:
      - label: PDF
        url:   /assets/papers/samm-review.pdf
      - label: DOI
        url:   "https://doi.org/10.1108/IR-05-2025-0162"
    body:
      - >-
        Published in <i>Industrial Robot</i>, Vol. 53 No. 2, pp. 376-398
        (2026). Written with Prof. Mervin Joe Thomas at NITK Surathkal.
      - h: Why this review
      - >-
        A soft autonomous mobile manipulator combines three parts: a mobile
        platform, a manipulator arm and a soft gripper. Each has advanced
        quickly on its own, but no review had examined <b>soft mobile
        manipulation as one system</b> for agriculture. This paper fills that
        gap for harvesting and crop monitoring.
      - h: What it covers
      - >-
        <b>Soft grippers:</b> gripping and actuation technologies compared
        across actuator families, assessing compliance, payload and crop-damage
        trade-offs for harvesting.
      - >-
        <b>Mobile bases:</b> classical and state-of-the-art localisation and
        path planning for robots operating in unstructured field environments.
      - >-
        <b>Integration:</b> motion planning for the mobile manipulator as a
        whole, and an analysis of its design space.
      - h: Findings
      - >-
        Integration is the hard part: real-time control, adapting to the field,
        and coordinating mobility with manipulation. The design-space analysis
        shows where <b>gripper compliance relaxes the precision</b> required
        from the base and the arm.
    gallery:
      - src:     /assets/img/soft-mobile-manipulators/fig11-field-robots.webp
        caption: "Agricultural mobile manipulators covered in the review (Figure 11). Sources: Chen et al. 2024b; Yuan et al. 2022; Wang et al. 2023a."
      - src:     /assets/img/soft-mobile-manipulators/samm-overview.png
        caption: "A SAMM combines a mobile platform, a manipulator arm and a soft gripper (Figure 1)."
      - src:     /assets/img/soft-mobile-manipulators/fig10-architecture.jpg
        caption: "Architecture of an agricultural mobile manipulator: perception, planning and control for the base, arm and soft gripper (Figure 10)."
      - src:     /assets/img/soft-mobile-manipulators/fig6-soft-grippers.webp
        caption: "Vacuum and hybrid soft grippers compared in the review (Figure 6). Sources: Jo et al. 2024; Gao et al. 2024; Zhuang et al. 2023; Rong et al. 2022."

  - slug:    niti-vahan
    title:   "Niti Vahan"
    status:  "eYRC 2026-27 theme, 1500 teams"
    tagline: "A new e-Yantra Robotics Competition theme on autonomous driving: a miniature car that follows city road rules."
    org:     "ERTS Lab (e-Yantra), IIT Bombay"
    period:  "2025 - 2026"
    advisor: "Prof. Kavi Arya, Prof. Shivaram Kalyanakrishnan"
    cover:   /assets/img/niti-vahan/theme-art.webp
    card: "A new eYRC theme on autonomous driving: a miniature car that follows city road rules."
    summary: >-
      A newly developed eYRC 2026-27 theme on autonomous driving, inspired in
      part by Duckietown and selected by 1500 teams nationally. I built the
      electronics and the monocular perception and control stack for a
      scratch-built miniature Ackermann car: bird's-eye-view lane detection
      with PID steering, obstacle detection, lane switching and ArUco-based
      parking, all on a Raspberry Pi with one USB camera. Teams start in a
      matched CoppeliaSim digital twin, then move to hardware.
    topics: [Autonomous Driving, Perception, Control, "Education & Outreach"]
    contributions:
      - "Developed the electronics for a scratch-built miniature Ackermann vehicle."
      - "Built the monocular perception and control stack: bird's-eye-view lane detection, PID steering, obstacle detection, lane switching and ArUco parking."
      - "The theme was selected by 1500 teams nationally for eYRC 2026-27."
    stack: [Raspberry Pi, OpenCV, CoppeliaSim, PID Control]
    links:
      - label: YouTube short
        url:   "https://youtube.com/shorts/P-VORIFtzig"
      - label: e-Yantra
        url:   "https://www.e-yantra.org/"
    hero:
      video:   /assets/video/niti-vahan/sim-run.mp4
      poster:  /assets/img/niti-vahan/sim-poster.jpg
      caption: "Full theme run in the CoppeliaSim digital twin."
    body:
      - >-
        Niti Vahan is a <b>newly developed theme</b> for the e-Yantra Robotics
        Competition (eYRC) 2026-27, focused on <b>autonomous driving</b> and
        inspired in part by
        <a href="https://duckietown.com/" target="_blank" rel="noopener">Duckietown</a>.
        A miniature car drives a city arena under road rules: lanes, zebra
        crossings, no-overtaking zones, stop signs and parking. 1500 teams
        selected it nationally.
      - h: The vehicle and its stack
      - >-
        I built the electronics and the perception and control algorithms for
        a <b>scratch-built miniature Ackermann vehicle</b>. The stack is
        deliberately minimal, a Raspberry Pi and one USB camera, so student
        teams can reproduce it.
      - >-
        Lanes are found by bird's-eye-view warping, colour segmentation and
        polynomial fitting, then tracked with <b>PID steering</b>. On top of
        that run obstacle detection, lane switching and <b>ArUco-based
        docking</b> for parking.
      - video:   /assets/video/niti-vahan/hardware-lane-obstacle.mp4
        poster:  /assets/img/niti-vahan/hardware-poster.jpg
        caption: "On hardware: lane following and obstacle avoidance."
      - h: Simulation to hardware
      - >-
        Teams first build against a matched <b>CoppeliaSim digital twin</b> in
        Stage 1, then move the same stack to the physical car in Stage 2.

