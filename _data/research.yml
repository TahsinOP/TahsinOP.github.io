  - slug:    visual-slam-uav
    title:   "Visual SLAM for UAVs"
    status:  "eYSIP 2025"
    tagline: "A complete visual SLAM system, built from scratch for indoor UAV navigation."
    org:     "e-Yantra, ERTS Lab, IIT Bombay"
    period:  "May 2025 - Jul 2025"
    cover:   /assets/img/visual-slam-uav/cover-map.jpg
    card: "Visual SLAM built from scratch with Open3D and OpenCV, with loop closure and relocalisation."
    summary: >-
      With ORB-SLAM3 and RTAB-Map impractical to adapt, and no end-to-end 3D
      visual SLAM and navigation stack comparable to Nav2, we built one from
      scratch with only Open3D and OpenCV: ICP registration, keyframing,
      incremental mapping, local and global loop closure with pose-graph
      optimisation, and bag-of-words relocalisation refined by ICP. Validated
      handheld on a RealSense D455 with an Orin NX.
    topics: [SLAM, Perception]
    contributions:
      - "Built a visual SLAM front end and back end from scratch with Open3D and OpenCV."
      - "Implemented local and global loop closure with pose-graph optimisation, and bag-of-words relocalisation refined by ICP."
      - "Validated handheld on a RealSense D455 with an Orin NX, and designed a tightly coupled VIO extension."
    stack: [Open3D, OpenCV, Pose-Graph Optimisation, RealSense]
    links:
      - label: Demo video
        url:   "https://youtu.be/ZpXdvz5h0xM"
    hero:
      youtube: ZpXdvz5h0xM
      poster:  /assets/img/visual-slam-uav/demo-poster.jpg
      caption: "Project demo: dense mapping, then live 6-DoF localisation in the built map."
    body:
      - >-
        ORB-SLAM3 and RTAB-Map are hard to adapt, and no end-to-end 3D visual
        SLAM and navigation stack comparable to Nav2 existed for our UAV. So we
        built the front end and back end <b>from scratch</b>, using only Open3D
        and OpenCV.
      - h: Mapping
      - img:     /assets/img/visual-slam-uav/pipeline.png
        caption: "The pipeline: keyframes, frame-to-frame ICP and a pose graph with local and global loop closure."
        invert_dark: true
      - >-
        ICP registration, keyframe selection and incremental map building
        produce consistent dense maps of indoor spaces. Local and global
        <b>loop closures</b> feed a pose-graph optimiser that removes
        accumulated drift.
      - img:     /assets/img/visual-slam-uav/mapping.jpg
        caption: "Dense maps of a room (with its optimised trajectory), a lab and a classroom."
      - h: Localisation
      - >-
        Relocalisation uses <b>bag-of-words place recognition</b>, refined by
        ICP against stored keyframes, to recover the full 6-DoF camera pose.
      - img:     /assets/img/visual-slam-uav/localization.jpg
        caption: "Live 6-DoF localisation in a prebuilt map."
        narrow:  true
      - h: Validation and next steps
      - >-
        The system was validated handheld on a <b>RealSense D455 with an Orin
        NX</b>. I also designed an extension to tightly coupled VIO, adding IMU
        preintegration factors to the pose graph.
      - h: Behind the project
      - >-
        e-Yantra's eYSIP 2025 video on the SLAM on UAVs project, with the team
        talking through the problem, what we built and what we learned.
      - youtube: FcKww3YTInA
        caption: "eYSIP 2025 project experience video, by e-Yantra."
    gallery:
      - src:     /assets/img/visual-slam-uav/pipeline.png
        caption: "Mapping and localisation pipeline."
        invert_dark: true
      - src:     /assets/img/visual-slam-uav/hardware.jpg
        caption: "The UAV hardware stack."
      - src:     /assets/img/visual-slam-uav/poster.jpg
        caption: "eYSIP 2025 project poster."

  - slug:    arms-ackermann
    title:   "Autonomous Ackermann Vehicle for Field Exploration"
    status:  "eYSIP 2024, ARMS Lab"
    tagline: "A ROS 2 four-wheel-drive Ackermann vehicle, from motor control to autonomous navigation."
    org:     "ARMS Lab, IIT Bombay"
    period:  "May 2024 - Jul 2024"
    advisor: "Prof. Arpita Sinha"
    cover:   /assets/img/arms-ackermann/cover.jpg
    card: "A ROS 2 Ackermann vehicle built from the motors up to autonomous navigation in Nav2."
    summary: >-
      At the Autonomous Robots and Multi-Systems Lab, I built a ROS 2-controlled
      4WD Ackermann vehicle for field exploration, from low-level motor and
      steering control to autonomous navigation on the physical platform.
      Odometry fuses the IMU with Vicon velocity through a Kalman filter, with
      LiDAR SLAM, AMCL localisation in Nav2 and a pure-pursuit planner on top.
    topics: [Navigation, SLAM, State Estimation, Hardware]
    contributions:
      - "Built a ROS 2 4WD Ackermann vehicle, from motor and steering control to autonomous navigation."
      - "Fused the IMU with Vicon velocity estimates in a Kalman filter for odometry."
      - "Ran LiDAR SLAM with AMCL localisation in Nav2 and a pure-pursuit planner for waypoints."
    stack: [ROS 2, Nav2, Kalman Filter, Pure Pursuit]
    links:
      - label: Code
        url:   "https://github.com/TahsinOP/eYSIP-24_Field_Exploration_ROS_Vehicles"
      - label: Video
        url:   "https://www.youtube.com/watch?v=xZkY93gYrdk"
    hero:
      youtube: xZkY93gYrdk
      caption: "Demo."
    body:
      - >-
        At the <b>Autonomous Robots and Multi-Systems (ARMS) Lab</b>, IIT
        Bombay, I built a ROS 2-controlled four-wheel-drive Ackermann vehicle
        for field exploration, taking it from low-level motor and steering
        control through to autonomous navigation on the physical platform.
      - h: State estimation
      - >-
        Odometry fuses the <b>IMU with Vicon velocity estimates</b> through a
        Kalman filter.
      - h: Mapping, localisation and planning
      - >-
        LiDAR SLAM builds the map, <b>AMCL in Nav2</b> localises the vehicle in
        it, and a <b>pure-pursuit planner</b> drives it through waypoints.
    gallery:
      - src:     /assets/img/arms-ackermann/hardware.png
        caption: "The vehicle."
      - src:     /assets/img/arms-ackermann/poster.jpg
        caption: "eYSIP 2024 project poster."
