- title:    "Imitation Learning for Arm Manipulation"
  subtitle: "Two parallel eYSIP 2026 projects benchmarking policies on real hardware"
  org:      "ERTS Lab, IIT Bombay · Mentor and co-mentor, 4 interns"
  date:     "May 2026 — Jul 2026"
  year:     2026
  featured: true
  domains:  [Learning, Manipulation, Perception]
  stack:    [LeRobot, ACT, SmolVLA, SO-101, UR5, AgileX Pika Sense, RealSense D405]
  points:
    - "Defined and led two parallel projects evaluating imitation learning policies on real hardware: a bimanual SO-101 setup (mentor, 3 interns) and a UR5 arm (co-mentor, 1 intern)."
    - "Benchmarked ACT and SmolVLA across bimanual pick and place, cube stacking, precision insertion and single-arm grasping, guiding dataset collection and end-to-end training; ran an ablation swapping an RGB wrist camera for a RealSense D405, modifying the ACT codebase for the extra modality."
    - "Built a teleoperation and data pipeline for the UR5, a platform LeRobot does not support: Pika Sense teleoperation, joint and image capture to ROS bags, and conversion into LeRobot format — a learned counterpart to the classical GraspNet and MoveIt pipeline built the previous year."
  links: []

- title:    "3D LiDAR SLAM on a UAV"
  subtitle: "LiDAR-inertial odometry onto a drone, from benchmark to flight"
  org:      "ERTS Lab, IIT Bombay · Mentor, 1 intern (eYSIP 2026)"
  date:     "May 2026 — Jul 2026"
  year:     2026
  featured: true
  domains:  [SLAM, Hardware, Perception]
  stack:    [LIO-SAM, FAST-LIO, KISS-ICP, Holybro X500, Airy LiDAR, Jetson Orin Nano, Pixhawk]
  points:
    - "Benchmarked KISS-ICP, LIO-SAM and FAST-LIO in simulation and on a handheld rig, mapping the KReSIT building at IIT Bombay; guided development of a custom back end on FAST-LIO's odometry adding keyframe storage, pose-graph optimisation and loop closure."
    - "Designed the full power distribution board and the sensor and compute mounts under tight payload constraints, for the airframe, Pixhawk, Orin Nano and LiDAR."
