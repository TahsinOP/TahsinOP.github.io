---
layout: default
---
<div class="post {% if page.wide %}wrap-wide{% else %}wrap{% endif %}">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {%- if page.subtitle -%}
    <p class="post-description">{{ page.subtitle }}</p>
    {%- endif -%}
  </header>

  <div class="post-body">
    {{ content }}
  </div>
</div>
